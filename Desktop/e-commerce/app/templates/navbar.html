<nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow">

    <div class="container">

        <a class="navbar-brand fw-bold fs-3"
           href="{{ url_for('main.home') }}">
            FlaskKart
        </a>

        <button class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarNav">

            <span class="navbar-toggler-icon"></span>

        </button>

        <div class="collapse navbar-collapse" id="navbarNav">

            <!-- Search -->

            <form class="d-flex mx-auto" action="{{ url_for('main.products') }}" method="GET">

                <input
                    class="form-control me-2"
                    type="search"
                    name="search"
                    placeholder="Search laptops, mobiles..."
                    value="{{ request.args.get('search', '') }}">

                <button class="btn btn-warning">
                    Search
                </button>

            </form>

            <!-- Menu -->

            <ul class="navbar-nav ms-auto align-items-center">

                <li class="nav-item">
                    <a class="nav-link"
                       href="{{ url_for('main.home') }}">
                        Home
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link"
                       href="{{ url_for('main.products') }}">
                        Products
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link"
                       href="{{ url_for('main.cart') }}">
                        Cart
                    </a>
                </li>

                {% if current_user.is_authenticated %}

                <li class="nav-item">
                    <a class="nav-link"
                       href="{{ url_for('main.logout') }}">
                        Logout
                    </a>
                </li>

                {% else %}

                <li class="nav-item">
                    <a class="nav-link"
                       href="{{ url_for('main.login') }}">
                        Login
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link"
                       href="{{ url_for('main.register') }}">
                        Register
                    </a>
                </li>

                {% endif %}

            </ul>

        </div>

    </div>

</nav>
